[package]
name = "soundel"
version = "0.1.0"
edition = "2021"
description = "Offline generative focus soundscapes for the terminal, modeled on Endel's Focus"
license = "MIT"

[[bin]]
name = "soundel"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossterm = "0.28"
ctrlc = { version = "3", features = ["termination"] }
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Audio code is far too slow unoptimized; keep tests and debug builds fast.
[profile.dev]
opt-level = 2
